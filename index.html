<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <div class="login-shell single-panel">
        <div class="login-panel">
            <div class="panel-header">
                <h2>Sign in to your workspace</h2>
                <p>Use your Supabase credentials to continue</p>
            </div>

            <div id="message"></div>
            
            <form id="loginForm" class="login-form">
                <div class="input-field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" required autocomplete="username" placeholder="you@company.com">
                </div>
                
                <div class="input-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                </div>
                
                <div class="input-field">
                    <label>Login as</label>
                    <div class="role-selection">
                        <label class="role-option">
                            <input type="radio" name="role" value="admin" required>
                            <span>Admin</span>
                        </label>
                        <label class="role-option">
                            <input type="radio" name="role" value="staff" required>
                            <span>Cashier</span>
                        </label>
                    </div>
                </div>

                <div class="form-links">
                    <button type="button" class="link-button" id="forgotPasswordLink">Forgot password?</button>
                </div>

                <button type="submit" id="loginBtn">Continue</button>
            </form>

            <p class="support-note">
                Need access? Contact your administrator to create an account.
            </p>
        </div>
    </div>

    <div class="reset-modal" id="resetModal" aria-hidden="true">
        <div class="reset-modal__content" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
            <button class="reset-modal__close" id="closeResetModal" aria-label="Close password reset form">&times;</button>
            <h3 id="resetTitle">Reset your password</h3>
            <p class="reset-modal__text">Enter your email address and we'll send you a reset link.</p>
            <form id="resetForm">
                <label for="resetEmail">Email address</label>
                <input type="email" id="resetEmail" placeholder="you@example.com" required>
                <button type="submit" id="resetSubmitBtn">Send reset link</button>
            </form>
            <p class="reset-modal__note" id="resetFeedback"></p>
        </div>
    </div>

    <script type="module">
        import { signIn, isAuthenticated, requestPasswordReset } from './js/auth.js';
        import { showToast, showLoading, hideLoading, validateEmail } from './js/utils.js';

        // Check if already logged in
        async function checkAuth() {
            const authenticated = await isAuthenticated();
            if (authenticated) {
                // Get user role and redirect
                const { user } = await import('./js/auth.js').then(m => m.getCurrentUser());
                if (user?.profile?.role === 'admin') {
                    window.location.href = '/dashboard.html';
                } else {
                    // Redirect cashier to POS (Orders page)
                    window.location.href = '/orders.html';
                }
            }
        }

        checkAuth();

        // Check for logged_out parameter
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('logged_out') === 'true') {
            showToast('You have been successfully logged out.', 'success');
            // Clean URL
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // Handle form submission
        const loginForm = document.getElementById('loginForm');
        const messageDiv = document.getElementById('message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const selectedRole = document.querySelector('input[name="role"]:checked')?.value;

            // Clear previous messages
            messageDiv.innerHTML = '';

            // Validate inputs
            if (!email || !password || !selectedRole) {
                showMessage('Please enter email, password, and select a role!', 'error');
                return;
            }

            // Show loading
            const loginBtn = document.getElementById('loginBtn');
            const originalText = loginBtn.textContent;
            loginBtn.textContent = 'Logging in...';
            loginBtn.disabled = true;

            try {
                // Sign in with Supabase
                const result = await signIn(email, password);

                if (!result.success) {
                    showMessage(result.error, 'error');
                    loginBtn.textContent = originalText;
                    loginBtn.disabled = false;
                    return;
                }

                // Check if selected role matches user's role
                const userRole = result.user.profile.role;
                if (selectedRole !== userRole) {
                    showMessage(
                        `Invalid role selected! Please select the correct role. Your account is: ${userRole.charAt(0).toUpperCase() + userRole.slice(1)}`,
                        'error'
                    );
                    loginBtn.textContent = originalText;
                    loginBtn.disabled = false;
                    return;
                }

                // Success! Redirect to appropriate dashboard
                showToast('Login successful!', 'success', 1000);
                
                setTimeout(() => {
                    if (userRole === 'admin') {
                        window.location.href = '/dashboard.html';
                    } else {
                        // Redirect cashier to POS (Orders page)
                        window.location.href = '/orders.html';
                    }
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                showMessage('An unexpected error occurred. Please try again.', 'error');
                loginBtn.textContent = originalText;
                loginBtn.disabled = false;
            }
        });

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            const color = type === 'error' ? '#ff4444' : '#10b981';
            messageDiv.innerHTML = `<p style="color: ${color};">${message}</p>`;
        }

        // Forgot password modal logic
        const resetModal = document.getElementById('resetModal');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');
        const closeResetModal = document.getElementById('closeResetModal');
        const resetForm = document.getElementById('resetForm');
        const resetEmailInput = document.getElementById('resetEmail');
        const resetFeedback = document.getElementById('resetFeedback');
        const resetSubmitBtn = document.getElementById('resetSubmitBtn');

        function openResetModal() {
            resetFeedback.textContent = '';
            resetFeedback.className = 'reset-modal__note';
            resetEmailInput.value = document.getElementById('email').value.trim();
            resetModal.classList.add('active');
            resetModal.setAttribute('aria-hidden', 'false');
            resetEmailInput.focus();
        }

        function closeReset() {
            resetModal.classList.remove('active');
            resetModal.setAttribute('aria-hidden', 'true');
        }

        forgotPasswordLink.addEventListener('click', openResetModal);
        closeResetModal.addEventListener('click', closeReset);
        resetModal.addEventListener('click', (event) => {
            if (event.target === resetModal) {
                closeReset();
            }
        });

        resetForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = resetEmailInput.value.trim();

            if (!email || !validateEmail(email)) {
                resetFeedback.textContent = 'Please enter a valid email address.';
                resetFeedback.classList.add('error');
                return;
            }

            resetSubmitBtn.disabled = true;
            resetSubmitBtn.textContent = 'Sending...';
            resetFeedback.textContent = '';
            resetFeedback.className = 'reset-modal__note';

            const { success, error } = await requestPasswordReset(email);

            if (success) {
                resetFeedback.textContent = 'Reset link sent! Please check your inbox.';
                resetFeedback.classList.add('success');
                showToast('Reset link sent! Please check your inbox.', 'success');
                setTimeout(closeReset, 1800);
            } else {
                resetFeedback.textContent = error || 'Failed to send reset link.';
                resetFeedback.classList.add('error');
            }

            resetSubmitBtn.disabled = false;
            resetSubmitBtn.textContent = 'Send reset link';
        });
    </script>
</body>
</html>
