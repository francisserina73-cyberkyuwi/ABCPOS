<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | ABC POS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <div class="login-shell single-panel">
        <div class="login-panel">
            <div class="panel-header">
                <h2>Set a new password</h2>
                <p>Choose a strong password for your account.</p>
            </div>
            <div id="resetAlert" class="reset-alert" role="status"></div>
            <form id="passwordResetForm" class="login-form">
                <div class="input-field">
                    <label for="newPassword">New password</label>
                    <input type="password" id="newPassword" minlength="8" required placeholder="Enter new password">
                </div>
                <div class="input-field">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" minlength="8" required placeholder="Confirm new password">
                </div>
                <button type="submit" id="resetBtn">Update password</button>
            </form>
            <button type="button" class="link-button back-to-login" id="backToLogin">← Back to login</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase-client.js';
        import { showToast } from './js/utils.js';
        import { updatePassword, getCurrentUser } from './js/auth.js';

        const resetForm = document.getElementById('passwordResetForm');
        const resetBtn = document.getElementById('resetBtn');
        const resetAlert = document.getElementById('resetAlert');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const backToLoginBtn = document.getElementById('backToLogin');

        function setAlert(message, type = 'info') {
            resetAlert.textContent = message;
            resetAlert.className = `reset-alert ${type}`;
        }

        async function establishRecoverySession() {
            const hash = window.location.hash;
            if (hash) {
                const params = new URLSearchParams(hash.substring(1));
                const type = params.get('type');
                const accessToken = params.get('access_token');
                const refreshToken = params.get('refresh_token');

                if (type === 'recovery' && accessToken && refreshToken) {
                    const { error } = await supabase.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });

                    if (error) {
                        setAlert('Reset link is invalid or has expired. Please request a new one.', 'error');
                        resetForm.classList.add('hidden');
                        return null;
                    }

                    window.location.hash = '';
                }
            }

            const { data, error } = await supabase.auth.getSession();
            if (error || !data.session) {
                setAlert('Reset link is invalid or has expired. Please request a new one.', 'error');
                resetForm.classList.add('hidden');
                return null;
            }

            const { user } = await getCurrentUser();
            if (user?.email) {
                setAlert(`Resetting password for ${user.email}`, 'info');
            } else {
                setAlert('Authenticated. You can now set a new password.', 'info');
            }

            return data.session;
        }

        const sessionPromise = establishRecoverySession();

        resetForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const newPassword = newPasswordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();

            if (newPassword.length < 8) {
                setAlert('Password must be at least 8 characters long.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                setAlert('Passwords do not match. Please try again.', 'error');
                return;
            }

            const session = await sessionPromise;
            if (!session) {
                setAlert('Your reset session is not valid. Request a new link.', 'error');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = 'Updating...';

            const { success, error } = await updatePassword(newPassword);

            if (success) {
                setAlert('Password updated successfully! Redirecting to login...', 'success');
                showToast('Password updated successfully. Please sign in with your new password.', 'success');
                setTimeout(() => {
                    window.location.href = '/index.html';
                }, 1500);
            } else {
                setAlert(error || 'Failed to update password. Please try again.', 'error');
            }

            resetBtn.disabled = false;
            resetBtn.textContent = 'Update password';
        });

        backToLoginBtn.addEventListener('click', () => {
            window.location.href = '/index.html';
        });
    </script>
</body>
</html>
